[package]
name = "louiselm-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local cross-project agent tool and command usage analysis"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.40"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
