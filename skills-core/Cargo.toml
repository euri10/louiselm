[package]
name = "louiselm-skills"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trusted packaging, Inspection, and Dossier rendering for LouiseLM Skill candidates"

[dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["zeroize"] }
httparse = "1.10"
rustix = { version = "1", features = ["fs", "net", "process", "rand", "termios", "pty", "event", "runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"
unicode-normalization = "=0.1.25"
webauthn-rs = { version = "0.5.5", default-features = false }
zeroize = "1.9"

[dev-dependencies]
openssl = "0.10"

# Installed fixtures repeatedly hash executables; keep those checks affordable
# without optimizing project code or disabling development assertions.
[profile.dev.package.sha2]
opt-level = 3

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
