[package]
name = "louiselm-skills"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trusted packaging, Inspection, and Dossier rendering for LouiseLM Skill candidates"

[dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["zeroize"] }
clap = { version = "4.6", features = ["derive"] }
httparse = "1.10"
# System libbpf.so.1 only: defaults would compile and statically link libbpf.
libbpf-rs = { version = "=0.25.0", default-features = false }
libbpf-sys = { version = "=1.5.1", default-features = false }
# Held at 1.1.4: launcher_install/foreground.rs uses runtime::kernel_sigprocmask
# for its reviewed SIGTTOU-only mask (louiselm-qnow). rustix 1.1.5 made
# `runtime` crate-private with no public replacement; louiselm-byrw2 removes
# the call, then this pin.
rustix = { version = "=1.1.4", features = ["fs", "net", "process", "rand", "termios", "pty", "event", "runtime", "thread", "mount", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real YAML frontmatter, with bounded parsing and no includes/interpolation.
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
semver = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"
unicode-normalization = "=0.1.25"
webauthn-rs = { version = "0.5.5", default-features = false }
zeroize = "1.9"

[dev-dependencies]
openssl = "0.10"

# Installed fixtures repeatedly hash executables; keep those checks affordable
# without optimizing project code or disabling development assertions.
[profile.dev.package.sha2]
opt-level = 3

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
