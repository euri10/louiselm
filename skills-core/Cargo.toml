[package]
name = "louiselm-skills"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trusted packaging, Inspection, and Dossier rendering for LouiseLM Skill candidates"

[dependencies]
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
