[package]
name = "louiselm-skills"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trusted packaging, Inspection, and Dossier rendering for LouiseLM Skill candidates"

[dependencies]
bip39 = { version = "2.2.2", default-features = false, features = ["zeroize"] }
rustix = { version = "1", features = ["fs", "net", "process", "rand", "termios", "pty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
