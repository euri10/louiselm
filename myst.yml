version: 1
project:
  title: LouiseLM
  downloads: []
  exclude:
    - AGENTS.md
    - CLAUDE.md
    - .beads/**
    - site/**
    - blog/post-*/conversations/**
    - android/**
    - capture-service/**
    - infra/**
    - skills-core/**
    - demo/**
  toc:
    - file: README.md
    - file: docs/index.md
      children:
        - file: docs/tutorial.md
        - file: docs/onboarding.md
        - file: docs/demo-promotion.md
        - file: docs/example-workflow.md
        - file: doc/api.md
        - file: CONTRIBUTING.md
        - file: POLITICAL_STATEMENT.md
        - file: TRADEMARK_POLICY.md
    - file: blog/index.md
      children:
        - pattern: 'blog/post-*/blog.md'
site:
  # Theme install/start commands execute in CI, so this must stay at a full commit.
  template: https://github.com/myst-templates/book-theme/archive/45706bcb9ac02b6713270785e3fc22eda348ed3b.zip
  options:
    folders: true
    logo: ./assets/louiselm-logo.png
    logo_alt: LouiseLM
    style: ./blog/blog.css
