[package]
name = "louiselm-capture"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Local-first durable speech capture service for LouiseLM"

[dependencies]
aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["non-fips"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "=0.22.1"
fs2 = "0.4"
httpdate = "=1.0.3"
http-body-util = "0.1"
pem = "3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
