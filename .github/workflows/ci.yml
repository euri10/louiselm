# GitHub Actions pipeline for the Neovim plugin's quality gates.
#
# Scope: this runs the gates docs/agent-testing.md declares authoritative --
# StyLua for formatting, lua-language-server for static analysis, and
# mini.test for tests on the Lua side, cargo fmt/clippy/test/doc for each
# Rust crate, and Gradle test/lint/assemble for Android. It deliberately does NOT
# build or publish blog/, which is pages.yml's job (runs only when
# blog/ changes). The two pipelines are disjoint on purpose: pages.yml
# owns publishing, this one owns correctness.
#
# Every gate below was verified to fail, not merely to pass, before
# being wired up here (louiselm-w726's lesson: a check whose failure
# path was never exercised is indistinguishable from no check):
#   stylua --check .                             0 clean / 1 misformatted
#   lua-language-server --check --checklevel=Warning  0 clean / 1 on warning
#   ./scripts/test-lua                           0 clean / 1 on test failure
#   cargo fmt --check                            0 clean / 1 misformatted
#   cargo clippy (all targets/features, locked)  0 clean / 101 on a lint
#   cargo test (all features, locked)           0 clean / 101 on test failure
#   cargo doc (no deps, warnings denied)        0 clean / 101 on a doc warning
#   Gradle Kotlin compilation                   0 clean / 1 on a warning
#   Gradle test                                 0 clean / 1 on a regression
#   Gradle lint                                 0 clean / 1 on a lint error
#
# The Rust gates cover capture-service/ and skills-core/ as separate jobs;
# they are separate crates with separate lockfiles, not a workspace, so one
# job's result says nothing about the other. capture-service's 56 tests were
# previously enforced nowhere (louiselm-ci-missing-rust-gates-5o5h). Its cargo
# test failure path was exercised by reverting the loopback status warning that
# fixes louiselm-capture-receiver-reachability-rnjc, which is precisely the
# defect these tests exist to keep fixed. skills-core's was exercised the same
# way, by disabling the hardlink-ambiguity refusal in capture and the
# digest-conflict refusal in the store and watching each guard's test go red.
# Android runs JVM/Robolectric tests without a device or live credentials.
# Failure probes: displaced pending-count update, deprecated Kotlin call, and
# incomplete translation resources. Existing lint warnings: louiselm-16a6.
#
# Tool versions are pinned rather than floated so an upstream release
# cannot silently turn this pipeline red (or, worse, green). Dependabot
# proposes upgrades as pull requests (.github/dependabot.yml); the Rust
# toolchain comes from rust-toolchain.toml. Neovim `stable` floats on purpose:
# a Neovim plugin wants to learn at once that a new stable release breaks it.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "blog/**"
  pull_request:
    paths-ignore:
      - "blog/**"
  workflow_dispatch:

# Supersede in-flight runs for the same ref. On a private repo Actions
# minutes are metered, so a rapid push sequence should not pay for
# every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the locally verified StyLua exactly (stylua 2.5.2).
  STYLUA_VERSION: 2.5.2
  # Local development currently runs 3.18.2-dev, which is not a
  # downloadable release; 3.19.1 is the closest published stable.
  LUALS_VERSION: 3.19.1

jobs:
  plugin-release-contract:
    name: Plugin release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The commit policy checks the commits that will be squash-merged,
          # not GitHub's synthetic pull-request merge commit (louiselm-pgp4t).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public site configuration and artifact boundaries
        run: npm run site:test
      - name: Check version, commit policy and publication refusals
        run: |
          ./scripts/generate-plugin-version --check
          python3 scripts/check-release-commits.py
          python3 scripts/test-plugin-release.py
          python3 scripts/test-gitlab-release-sync.py
          python3 scripts/capture_release.py --check
          python3 scripts/test-capture-release.py
      - name: Test the exact release tool against disposable API history
        run: |
          set -eu
          release_tool_dir="$(mktemp -d)"
          git clone --quiet https://github.com/googleapis/release-please-action.git "$release_tool_dir"
          git -C "$release_tool_dir" checkout --quiet 45996ed1f6d02564a971a2fa1b5860e934307cf7
          npm ci --prefix "$release_tool_dir" --omit=dev --ignore-scripts --no-audit --no-fund
          NODE_PATH="$release_tool_dir/node_modules" node --test scripts/test-release-please.cjs

  agent-instructions:
    name: Agent instruction budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-agent-instructions

  public-skills:
    name: Published skills carry no private details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install existing YAML runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks libyaml-dev
          sudo luarocks --lua-version 5.1 install lyaml
          eval "$(luarocks --lua-version 5.1 path --no-bin)"
          {
            echo "LUA_PATH=$LUA_PATH"
            echo "LUA_CPATH=$LUA_CPATH"
          } >> "$GITHUB_ENV"
      - run: ./scripts/test-public-skills.sh
      - run: ./scripts/check-public-skills

  beads-records:
    name: Beads records sorted and unique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-stage-beads-records.py
      - run: ./scripts/stage-beads-records --check HEAD

  ecosystem-radar:
    name: Ecosystem radar offline contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-ecosystem-radar.py

  qualification-preview:
    name: Qualification preview and preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-qualification-preview.py
      - run: python3 scripts/test-qualification-run.py
      - run: python3 scripts/test-conformance-qa.py
      - run: python3 scripts/test-install-qa-runtime.py

  usage-cli:
    name: cargo (usage-cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usage-cli
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and SQLite development library
        run: |
          set -eu
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            usage-cli/target
          key: cargo-usage-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('usage-cli/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  launcher-vm-contract:
    name: Launcher VM safety contract (no VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-utils
      - run: bash -n scripts/launcher-vm scripts/verifier-toolchain && ./scripts/test-launcher-vm.sh
      - run: python3 scripts/test-consumed-recovery-vm.py

  sender-guard-vm:
    name: Sender guard object and loader (disposable KVM)
    runs-on: ubuntu-latest
    # Includes building the qualified native tracker, not just its old double.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install existing launcher VM prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso jq
          # Provision only this disposable CI runner. The developer wrapper
          # still requires existing KVM access and never falls back to sudo.
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          test -r /dev/kvm && test -w /dev/kvm
          systemctl --user show-environment >/dev/null
      - name: Build the qualified native Beads tracker
        run: |
          set -euo pipefail
          revision=5830c1e49ae0f38b67fc50382c8481f1ff46a7cf
          git init --quiet "$RUNNER_TEMP/qualified-br"
          git -C "$RUNNER_TEMP/qualified-br" fetch --depth=1 https://github.com/euri10/beads_rust.git "$revision"
          git -C "$RUNNER_TEMP/qualified-br" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/qualified-br" rev-parse HEAD)" = "$revision"
          cd "$RUNNER_TEMP/qualified-br"
          rustup toolchain install nightly-2026-08-31 --profile minimal
          CARGO_BUILD_JOBS=1 cargo build --release --locked --bin br
          ./target/release/br version | grep -F 5830c1e
          install -m 755 target/release/br "$RUNNER_TEMP/louiselm-native-br"
      - name: Prepare the pinned guest with build and verifier tools
        run: |
          install -d -m 700 "${XDG_CACHE_HOME:-$HOME/.cache}"
          ./scripts/launcher-vm prepare
      - name: Fetch the hash-pinned stock Codex chain
        run: |
          python3 scripts/test-stock-codex-chain.py
          python3 scripts/fetch-stock-codex-chain "$RUNNER_TEMP/louiselm-stock-chain"
          python3 scripts/fetch-stock-codex-chain --check "$RUNNER_TEMP/louiselm-stock-chain"
      - name: Exercise the embedded object with restricted guest networking
        run: |
          ./scripts/launcher-vm start
          ./scripts/launcher-vm put "$RUNNER_TEMP/louiselm-native-br" /var/tmp/louiselm-native-br
          ./scripts/launcher-vm exec mkdir -p /var/tmp/louiselm-stock-chain
          tar -C "$RUNNER_TEMP/louiselm-stock-chain" -c node codex-acp.js codex codex-code-mode-host louiselm-discovery.json |
            ./scripts/launcher-vm exec tar -x -C /var/tmp/louiselm-stock-chain
          git archive HEAD scripts/test-sender-guard.py scripts/test-sender-guard-loader.py scripts/test-sender-guard-handoff.py scripts/probes/codex-kernel-guard \
            skills-core/src/launch_supervisor/sender_guard/binding.bpf.c skills-core/src/launch_supervisor/sender_guard/lifecycle.bpf.c |
            ./scripts/launcher-vm exec tar -x -C /var/tmp
          ./scripts/launcher-vm exec python3 /var/tmp/scripts/test-sender-guard.py \
            --disposable-vm /var/tmp/louiselm-skills-target/debug/louiselm-launch
          library_test=$(./scripts/launcher-vm exec bash -ceu '
            export PATH=/home/vm/.cargo/bin:/usr/bin:/bin CARGO_NET_OFFLINE=true
            export CARGO_TARGET_DIR=/var/tmp/louiselm-skills-target CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo test --manifest-path /home/vm/skills-core/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty'\''
          ')
          test -n "$library_test"
          ./scripts/launcher-vm exec sudo -n python3 /var/tmp/scripts/test-sender-guard-loader.py \
            "$library_test"
          ./scripts/launcher-vm exec sudo -n python3 /var/tmp/scripts/test-sender-guard-handoff.py \
            "$library_test" /var/tmp/louiselm-skills-target/debug/deps
      - name: Exercise installed conformance with the production guard
        run: |
          ./scripts/launcher-vm exec bash -ceu '
            export PATH=/home/vm/.cargo/bin:/usr/bin:/bin CARGO_NET_OFFLINE=true
            export CARGO_TARGET_DIR=/var/tmp/louiselm-skills-target CARGO_PROFILE_DEV_DEBUG=line-tables-only
            library_test=$(cargo test --manifest-path /home/vm/skills-core/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty'\'')
            test -x "$library_test"
            # Platform construction creates fixed roots even when Sessions use a fixture directory.
            private_state='\''umask 022; mkdir -p /var/lib/louiselm; mount -t tmpfs -o mode=0711 tmpfs /var/lib/louiselm; exec "$@"'\''
            sudo -n env LOUISELM_REQUIRE_CERTIFICATION=1 timeout 240 unshare --net -- \
              /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::certification::privileged_installed_certification_owns_probes_and_retains_exact_evidence --exact --nocapture'\'' bash "$library_test"
            # The Ubuntu job can prove refusal only; require these positive
            # producer paths in the pinned Debian/BPF guest as well.
            for scenario in \
              privileged_initial_waiver_prepares_approves_then_launches \
              privileged_certified_admission_retains_report_and_suspends_on_evidence_loss; do
              sudo -n env LOUISELM_REQUIRE_CONTROL_DAEMON=1 timeout 240 \
                unshare --mount --net --propagation private -- \
                /bin/bash -c '\''umask 022; exec "$1" "$2" --exact --nocapture'\'' bash "$library_test" \
                "launch_supervisor::system::installed_tests::daemon::inspection::$scenario"
            done
            sudo -n env LOUISELM_REQUIRE_CERTIFICATION=1 LOUISELM_EXPECT_GUARD_UNAVAILABLE=1 timeout 60 unshare --mount --net --propagation private -- \
              /bin/bash -c '\''umask 022; mount --bind /dev/null /sys/kernel/btf/vmlinux; exec "$1" launch_supervisor::system::installed_tests::certification::privileged_installed_certification_owns_probes_and_retains_exact_evidence --exact --nocapture'\'' bash "$library_test"
            for scenario in \
              privileged_installed_brokered_guard_start_and_disposal \
              privileged_installed_brokered_fixture_releases_guard_before_returning \
              privileged_installed_brokered_guard_lost_close_ack_poison \
              privileged_installed_brokered_guard_broker_outage_poison \
              privileged_installed_brokered_guard_park_closes_before_receipt \
              privileged_installed_brokered_provider_stream \
              privileged_installed_brokered_guard_warm_resume_provider \
              privileged_installed_brokered_codex_chain_enrolls_descendant \
              privileged_installed_brokered_codex_missing_descendant_times_out \
              privileged_installed_brokered_codex_wrong_ancestry_refuses \
              privileged_installed_brokered_without_provider_permission_refuses; do
              sudo -n env LOUISELM_REQUIRE_BROKER_GUARD=1 timeout 90 unshare --mount --net --propagation private -- \
                /bin/bash -c "$private_state" fixture "$library_test" "launch_supervisor::system::installed_tests::guard::$scenario" --exact --nocapture
            done
            sudo -n env LOUISELM_REQUIRE_BROKER_GUARD=1 timeout 120 unshare --mount --net --propagation private -- \
              /bin/bash -c "$private_state" fixture "$library_test" launch_supervisor::system::installed_tests::verification::budget::privileged_installed_run_budget --exact --nocapture
            # Exact-job execution requires the trusted verifier provisioned in this guest.
            sudo -n env LOUISELM_REQUIRE_BROKER_LAUNCH=1 timeout 180 unshare --mount --net --propagation private -- \
              /bin/bash -c "$private_state" fixture "$library_test" launch_supervisor::system::installed_tests::failed_launch_delivery::privileged_installed_failed_launch_delivery --exact --nocapture
            sudo -n env LOUISELM_REQUIRE_BROKER_LAUNCH=1 timeout 300 unshare --mount --propagation private -- \
              /bin/bash -c "$private_state" fixture "$library_test" launch_supervisor::system::installed_tests::verification::privileged_installed_exact_job_verification --exact --nocapture
            sudo -n env LOUISELM_REQUIRE_BROKER_GUARD=1 LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain timeout 90 unshare --mount --net --propagation private -- \
              /bin/bash -c "$private_state" fixture "$library_test" launch_supervisor::system::installed_tests::guard::privileged_installed_brokered_stock_codex_completes_prompt --exact --nocapture
            sudo -n env LOUISELM_REQUIRE_BROKER_GUARD=1 LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain timeout 90 unshare --mount --net --propagation private -- \
              /bin/bash -c "$private_state" fixture "$library_test" launch_supervisor::system::installed_tests::guard::privileged_installed_brokered_stock_codex_skills_off_completes_prompt --exact --nocapture
            LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain "$library_test" launch_supervisor::system::installed_tests::codex_chain::stock_runtime_rejects_a_wrong_registered_hash --exact
            sudo -n env LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain timeout 60 unshare --net -- \
              "$library_test" launch_supervisor::system::installed_tests::codex_chain::stock_tools_keep_neovim_logs_outside_source --exact --nocapture
            "$library_test" launch_supervisor::tool_integration::tests::registration_selects_only_known_contracts_without_overrides --exact
            "$library_test" launch_supervisor::tool_integration::tests::codex_sender_is_the_one_measured_runtime_child_of_the_adapter --exact
          '
          # The following reboot gate requires an untouched fixed Session root.
          ./scripts/launcher-vm exec sudo -n test ! -e /var/lib/louiselm/sessions
      - name: Exercise the Lua Bead executor through the installed launcher
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run the installed Lua controller gate
        run: |
          git archive HEAD lua tests/workflow/installed_beads.lua tests/workflow/installed_operator.lua tests/routing/installed_trial.lua scripts/bead-run.lua scripts/bead-rehearse.lua scripts/install-broker-beads.py scripts/install-broker-attention.py scripts/conformance-qa.py scripts/install-qa-runtime.py scripts/fetch-stock-codex-chain |
            ./scripts/launcher-vm exec tar -x -C /home/vm
          ./scripts/launcher-vm exec mkdir /var/tmp/louiselm-controller-source
          git archive HEAD | ./scripts/launcher-vm exec tar -x -C /var/tmp/louiselm-controller-source
          # Build a source-only fixture commit from explicitly named tracked
          # paths, without copying repository history or the developer index.
          git ls-tree -rz --name-only HEAD | ./scripts/launcher-vm exec bash -ceu '
            git -C /var/tmp/louiselm-controller-source init -q --initial-branch=fixture-source
            xargs -0 git -C /var/tmp/louiselm-controller-source add --force --
            git -C /var/tmp/louiselm-controller-source -c user.name=Fixture -c user.email=fixture@invalid -c commit.gpgsign=false commit -qm Source
            /var/tmp/louiselm-skills-target/debug/louiselm-skills workspace prepare \
              --repository /var/tmp/louiselm-controller-source --output /var/tmp/louiselm-controller-snapshot --robot-json
          '
          rustup toolchain install
          cargo build --manifest-path capture-service/Cargo.toml --locked --bin louiselm-capture
          ./scripts/launcher-vm put capture-service/target/debug/louiselm-capture /var/tmp/louiselm-test-capture
          capture_test=$(CARGO_TARGET_DIR="$RUNNER_TEMP/louiselm-capture-review-target" \
            cargo test --manifest-path capture-service/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_capture" and .profile.test) | .executable // empty')
          test -x "$capture_test"
          ./scripts/launcher-vm put "$capture_test" /var/tmp/louiselm-test-capture-review
          nvim_root=$(nvim --headless --noplugin -u NONE -c 'lua io.write(vim.fs.dirname(vim.fs.dirname(vim.v.progpath)))' -c 'qa!')
          test -x "$nvim_root/bin/nvim" && test -d "$nvim_root/share/nvim/runtime"
          ./scripts/launcher-vm exec mkdir -p /var/tmp/louiselm-test-nvim
          tar -C "$nvim_root" -c bin share |
            ./scripts/launcher-vm exec tar -x -C /var/tmp/louiselm-test-nvim
          ./scripts/launcher-vm exec bash -ceu '
            export PATH=/home/vm/.cargo/bin:/usr/bin:/bin CARGO_NET_OFFLINE=true
            export CARGO_TARGET_DIR=/var/tmp/louiselm-skills-target CARGO_PROFILE_DEV_DEBUG=line-tables-only
            library_test=$(cargo test --manifest-path /home/vm/skills-core/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty'\'')
            test -x "$library_test"
            sudo -n env TMPDIR=/var/lib timeout 60 /bin/bash -c '\''umask 077; exec "$1" sandbox::operator_profile::tests::privileged_profile_source_is_readable_only_by_its_assigned_identity --exact --ignored --nocapture'\'' bash "$library_test"
            preparation_test=$(cargo test --manifest-path /home/vm/skills-core/Cargo.toml --test instruction_view --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "instruction_view" and .profile.test) | .executable // empty'\'')
            test -x "$preparation_test"
            sudo -n env TMPDIR=/var/lib timeout 60 /bin/bash -c '\''umask 022; exec "$1" preparation::privileged_preparation_cli_measures_trusted_owners_without_launch --exact --ignored --nocapture'\'' bash "$preparation_test"
            for bead_case in 1 2 3 4 5 6 7 8 9 14 15; do
              bead_timeout=$((bead_case >= 14 ? 300 : 120))
              decisions=pending
              if [ "$bead_case" = 15 ]; then
                decisions="pending accepted discarded application_unknown application_completed"
              fi
              for decision in $decisions; do
                sudo -n env LOUISELM_REQUIRE_BEAD_EXECUTOR=1 LOUISELM_BEAD_EXECUTOR_CASE="$bead_case" \
                  LOUISELM_TEST_REVIEW_DECISION="$decision" LOUISELM_TEST_LUA_ROOT=/home/vm \
                  LOUISELM_TEST_BEADS_INSTALLER=/home/vm/scripts/install-broker-beads.py \
                  LOUISELM_TEST_CAPTURE=/var/tmp/louiselm-test-capture \
                  LOUISELM_TEST_CAPTURE_TEST=/var/tmp/louiselm-test-capture-review \
                  LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout "$bead_timeout" \
                  unshare --mount --propagation private -- /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::bead_executor::privileged_installed_lua_bead_executor --exact --nocapture'\'' bash "$library_test"
              done
            done
            # Keep the empty case above as the unset check, then require real
            # source bytes through both startup and the operator/capture path.
            sudo -n env LOUISELM_REQUIRE_BROKER_GUARD=1 LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain \
              LOUISELM_TEST_WORKSPACE_SNAPSHOT=/var/tmp/louiselm-controller-snapshot timeout 180 \
              unshare --mount --net --propagation private -- \
              /bin/bash -ec '\''umask 022; /usr/sbin/ip link set lo up; mkdir -p /var/lib/louiselm; mount -t tmpfs -o mode=0711 tmpfs /var/lib/louiselm; exec "$@"'\'' fixture \
              "$library_test" launch_supervisor::system::installed_tests::guard::privileged_installed_brokered_stock_codex_skills_off_completes_prompt --exact --nocapture
            sudo -n env LOUISELM_REQUIRE_BEAD_EXECUTOR=1 LOUISELM_BEAD_EXECUTOR_CASE=5 \
              LOUISELM_TEST_WORKSPACE_SNAPSHOT=/var/tmp/louiselm-controller-snapshot \
              LOUISELM_TEST_LUA_ROOT=/home/vm LOUISELM_TEST_BEADS_INSTALLER=/home/vm/scripts/install-broker-beads.py \
              LOUISELM_TEST_CAPTURE=/var/tmp/louiselm-test-capture LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout 240 \
              unshare --mount --propagation private -- /bin/bash -c '\''umask 022; exec "$@"'\'' fixture \
              "$library_test" launch_supervisor::system::installed_tests::daemon::bead_executor::privileged_installed_lua_bead_executor --exact --nocapture
            # First the unchanged production daemon through real capture attach,
            # without a prompt; then the same dispatcher with test-only TLS roots
            # through three stock workers, real promotions and six terminal chains.
            for stock_case in 11 12 13 10; do
              sudo -n env LOUISELM_REQUIRE_BEAD_EXECUTOR=1 LOUISELM_BEAD_EXECUTOR_CASE="$stock_case" \
                LOUISELM_STOCK_CODEX_DIR=/var/tmp/louiselm-stock-chain \
                LOUISELM_TEST_BR=/var/tmp/louiselm-native-br \
                LOUISELM_TEST_BEADS_JSONL=/var/tmp/louiselm-controller-source/.beads/issues.jsonl \
                LOUISELM_TEST_WORKSPACE_SNAPSHOT=/var/tmp/louiselm-controller-snapshot \
                LOUISELM_TEST_LUA_ROOT=/home/vm LOUISELM_TEST_BEADS_INSTALLER=/home/vm/scripts/install-broker-beads.py \
                LOUISELM_TEST_CAPTURE=/var/tmp/louiselm-test-capture LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout 360 \
                unshare --mount --net --propagation private -- \
                /bin/bash -ec '\''umask 022; /usr/sbin/ip link set lo up; exec "$@"'\'' fixture \
                "$library_test" launch_supervisor::system::installed_tests::daemon::bead_executor::privileged_installed_lua_bead_executor --exact --nocapture
            done
            sudo -n env LOUISELM_REQUIRE_BEAD_EXECUTOR=1 LOUISELM_BEAD_EXECUTOR_CASE=1 \
              LOUISELM_TEST_LUA_ROOT=/home/vm \
              LOUISELM_TEST_BEADS_INSTALLER=/home/vm/scripts/install-broker-beads.py \
              LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout 120 \
              unshare --mount --propagation private -- /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::bead_executor::privileged_installed_lua_bead_executor_failure_cleanup --exact --nocapture'\'' bash "$library_test"
            sudo -n env LOUISELM_REQUIRE_ACTIVATED_GUARD=1 LOUISELM_TEST_LUA_ROOT=/home/vm \
              LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout 180 \
              unshare --mount --net --propagation private -- /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::qualification::privileged_activated_brokered_guard_start --exact --nocapture'\'' bash "$library_test"
            sudo -n env LOUISELM_REQUIRE_QUALIFICATION=1 LOUISELM_TEST_LUA_ROOT=/home/vm \
              LOUISELM_TEST_NVIM=/var/tmp/louiselm-test-nvim/bin/nvim timeout 180 \
              unshare --mount --net --propagation private -- /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::qualification::privileged_installed_lua_qualification --exact --nocapture'\'' bash "$library_test"
            sudo -n env LOUISELM_REQUIRE_QA_ENTRYPOINT=1 LOUISELM_TEST_LUA_ROOT=/home/vm timeout 180 \
              unshare --mount --net --propagation private -- /bin/bash -c '\''umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::qa_entrypoint::privileged_installed_no_provider_qa_entrypoint --exact --nocapture'\'' bash "$library_test"
          '
      - name: Recover consumed launches across a real kernel reboot
        run: |
          set -euo pipefail
          library_test=$(./scripts/launcher-vm exec bash -ceu '
            export PATH=/home/vm/.cargo/bin:/usr/bin:/bin CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0
            export CARGO_TARGET_DIR=/var/tmp/louiselm-skills-target CARGO_PROFILE_DEV_DEBUG=line-tables-only
            cargo build --manifest-path /home/vm/skills-core/Cargo.toml --bins --all-features --locked
            cargo test --manifest-path /home/vm/skills-core/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty'\''
          ')
          bash scripts/test-consumed-recovery-vm "$library_test"
      - name: Run the Lua gates inside the offline confined verifier
        run: |
          set -euo pipefail
          ./scripts/launcher-vm put scripts/test-verifier-toolchain.py /home/vm/test-verifier-toolchain.py
          ./scripts/launcher-vm exec sudo -n python3 /home/vm/test-verifier-toolchain.py
          ./scripts/launcher-vm exec sudo -n python3 /home/vm/test-verifier-toolchain.py --installed
          ./scripts/launcher-vm exec /bin/bash /home/vm/verifier-toolchain check
          ./scripts/launcher-vm exec mkdir -p /var/tmp/louiselm-lua-source
          git archive HEAD | ./scripts/launcher-vm exec tar -x -C /var/tmp/louiselm-lua-source
          ./scripts/launcher-vm exec bash -ceu '
            export PATH=/home/vm/.cargo/bin:/usr/bin:/bin CARGO_NET_OFFLINE=true
            export CARGO_TARGET_DIR=/var/tmp/louiselm-skills-target CARGO_PROFILE_DEV_DEBUG=line-tables-only
            library_test=$(cargo test --manifest-path /home/vm/skills-core/Cargo.toml --lib --all-features --locked --no-run --message-format=json |
              jq -r '\''select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty'\'')
            test -x "$library_test"
            sudo -n env LOUISELM_LUA_SOURCE=/var/tmp/louiselm-lua-source timeout 900 \
              /bin/bash -c '\''umask 077; exec "$1" launch_supervisor::tool_execution::tests::privileged_confined_lua_gates_from_clean_snapshot --exact --nocapture'\'' bash "$library_test"
          '
          # The disposable overlay must also reject changed dependency bytes.
          ./scripts/launcher-vm exec sudo -n bash -ceu '
            printf drift >> /usr/lib/louiselm/verifier/snacks.nvim/lua/snacks/init.lua
            if output=$(/bin/bash /home/vm/verifier-toolchain check 2>&1); then
              echo "changed toolchain passed its check" >&2; exit 1
            fi
            [[ $output == *"trusted toolchain bytes drifted"* ]]
          '
      - name: Dispose the guest
        if: always()
        run: |
          if [ -d "${XDG_CACHE_HOME:-$HOME/.cache}/louiselm-launcher-vm" ]; then
            ./scripts/launcher-vm stop
          fi

  coordination-snapshot:
    name: Agent liveness snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/agent-liveness-snapshot && ./scripts/test-agent-liveness-snapshot.sh

  acp-local-backup:
    name: ACP backup, copy and retention (synthetic data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned runtime and run isolated backup tests
        run: |
          set -eu
          backup_test_tools="$(mktemp -d)"
          curl --fail --location --retry 2 --max-time 120 \
            --output "$backup_test_tools/restic.bz2" \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          printf '%s  %s\n' \
            f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c \
            "$backup_test_tools/restic.bz2" | sha256sum --check
          bzip2 --decompress "$backup_test_tools/restic.bz2"
          chmod 0755 "$backup_test_tools/restic"
          "$backup_test_tools/restic" version
          PATH="$backup_test_tools:$PATH" python3 scripts/test-acp-log-backup.py
          XDG_RUNTIME_DIR="$backup_test_tools" systemd-analyze --user verify \
            contrib/systemd/louiselm-acp-backup.service contrib/systemd/louiselm-acp-backup.timer \
            contrib/systemd/louiselm-acp-cloud-copy.service contrib/systemd/louiselm-acp-cloud-copy.timer \
            contrib/systemd/louiselm-acp-backup-failure.service

  android:
    name: Android tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # Reuse downloaded artifacts, not build outputs or machine configuration.
      # Cold misses still fail normally if the dependency repository is unavailable.
      - name: Cache Android dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/**/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper/dists
          key: android-deps-v1-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            android-deps-v1-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-

      # Use the runner's installed JDK/SDK, not another setup dependency.
      - name: Test, lint, and assemble
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
          ./gradlew --no-daemon -PlouiselmFirebase=false test lint lintQa assembleDebug assembleQa
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id \
            app/build/outputs/apk/qa/app-qa.apk)" = "dev.louiselm.capture.qa"

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test phone-control end to end
        working-directory: .
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          rustup toolchain install
          cargo build --manifest-path capture-service/Cargo.toml --locked --bin louiselm-capture
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            LOUISELM_TEST_ANDROID=1 \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::tests::https_read_reaches_a_real_headless_session -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::selection_tests::android_selection_reaches_a_real_owner_with_no_sessions -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::voice_tests::pinned_receiver_and_android_review_archived_voice -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::voice_job_tests::pinned_android_recording_reaches_authorized_receiver_and_editable_draft -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::settings_tests::pinned_android_displays_acknowledged_session_settings -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::permission_tests::pinned_android_reads_current_permission_until_desktop_resolution -- --exact --ignored
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::interaction_tests::pinned_android_reads_current_interaction_until_desktop_resolution -- --exact --ignored

  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: --check .

  typecheck:
    name: lua-language-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache lua-language-server
        id: cache-luals
        uses: actions/cache@v6
        with:
          path: ~/.local/lua-language-server
          key: luals-${{ runner.os }}-${{ env.LUALS_VERSION }}

      - name: Install lua-language-server
        if: steps.cache-luals.outputs.cache-hit != 'true'
        run: |
          set -eu
          dest="$HOME/.local/lua-language-server"
          mkdir -p "$dest"
          curl -fsSL \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$dest"

      - name: Add lua-language-server to PATH
        run: echo "$HOME/.local/lua-language-server/bin" >> "$GITHUB_PATH"

      # --checklevel=Warning promotes warnings to failures, matching the
      # documented local gate. Verified to exit 1 on a single
      # undefined-global rather than reporting diagnostics and exiting 0.
      - name: Check
        run: lua-language-server --check . --checklevel=Warning

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Shares this job because it is the only one with lua-language-server
      # on PATH; scripts/generate-api-appendix shells out to `--doc`.
      - name: Verify generated API appendix
        run: ./scripts/generate-api-appendix --check

  test:
    name: mini.test (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    # docs/agent-lua.md targets the latest stable Neovim, so stable is
    # the contract and must block. Nightly runs for early warning of an
    # upstream break but is advisory: it must not fail the pipeline for
    # a change that honours the stated contract.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # The installer pins and verifies both plugins. Its bytes invalidate the
      # cache whenever either pin or the installation contract changes.
      - name: Cache Lua test dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: lua-test-deps-${{ hashFiles('scripts/install-test-deps') }}

      - name: Verify pinned dependency installation
        run: python3 scripts/test-install-test-deps.py

      - name: Install test dependencies
        run: ./scripts/install-test-deps

      # lua/louiselm/skills/discovery.lua requires lyaml to parse SKILL.md
      # frontmatter. It degrades gracefully when absent, so a machine without
      # it does not crash -- it silently fails 36 assertions across four spec
      # files that expect real parsed skill data (louiselm-zpsj).
      #
      # scripts/install-test-deps provisions mini.nvim and Snacks. LuaRocks and
      # LibYAML provisioning remains an explicit operator/CI step; see
      # louiselm-zpsj before combining those setup paths.
      #
      # Exporting LUA_PATH/LUA_CPATH is the mechanism the project already
      # documents for this: discovery.lua's own error text tells users to eval
      # `luarocks path` in the shell that launches Neovim.
      - name: Install lyaml and SQLite
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lua5.1 liblua5.1-0-dev luarocks libyaml-dev sqlite3
          sudo luarocks --lua-version 5.1 install lyaml
          eval "$(luarocks --lua-version 5.1 path --no-bin)"
          {
            echo "LUA_PATH=$LUA_PATH"
            echo "LUA_CPATH=$LUA_CPATH"
          } >> "$GITHUB_ENV"

      - name: Verify Neovim can load lyaml
        run: |
          nvim --headless --noplugin \
            -c "lua assert(pcall(require, 'lyaml'), 'nvim cannot require lyaml')" \
            -c "qa!"

      - name: Verify generated Vimdoc
        run: ./scripts/generate-vimdoc --check

      # Verified to fail, not merely to pass: 0 clean / 1 when the committed
      # lua/louiselm/types.lua diverges from the config schema.
      - name: Verify generated config types
        run: ./scripts/generate-luacats --check

      - name: Run tests
        run: |
          python3 scripts/test-lua-runner.py
          ./scripts/test-lua

      - name: Verify usage benchmark failure artifacts
        run: python3 scripts/test-usage-benchmark.py

  capture-service:
    name: cargo (capture-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture-service
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -eu
          rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capture-service/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('capture-service/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Test phone host reference candidate
        run: python3 ../scripts/test-phone-host.py

      - name: Test phone receiver exclusion in a private network namespace
        run: |
          sudo unshare --net -- /bin/sh -c '
            set -eu
            ip link set lo up
            ip addr add 10.254.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              env -i "HOME=$3" "PATH=$4" "TMPDIR=$5" LANG=C.UTF-8 cargo test --offline --locked \
              --test phone_namespace_scope -- --ignored --exact \
              real_receiver_and_offline_cutoff_share_exclusion
          ' sh "$(id -u)" "$(id -g)" "$HOME" "$PATH" "${RUNNER_TEMP:-/tmp}"

      - name: Test personal phone approval and durable startup
        run: |
          sudo unshare --mount --net --propagation private -- /bin/sh -c '
            set -eu
            mount -t tmpfs -o mode=0755 tmpfs /run
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              env -i "HOME=$3" "PATH=$4" "TMPDIR=$5" LANG=C.UTF-8 cargo test --offline --locked \
              --test personal_phone_startup -- --ignored --test-threads=1
          ' sh "$(id -u)" "$(id -g)" "$HOME" "$PATH" "${RUNNER_TEMP:-/tmp}"

      - name: Test capture without transcription credentials
        run: |
          sudo unshare --net -- /bin/sh -c '
            set -eu
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              env -i "HOME=$3" "PATH=$4" "TMPDIR=$5" LANG=C.UTF-8 cargo test --offline --locked \
              --test voice_cli -- --ignored --exact missing_transcription_configuration_preserves_real_capture_upload
          ' sh "$(id -u)" "$(id -g)" "$HOME" "$PATH" "${RUNNER_TEMP:-/tmp}"

      - name: Test registration consumers in private namespaces
        run: |
          sudo unshare --mount --net --propagation private -- /bin/sh -c '
            set -eu
            mount -t tmpfs -o mode=0755 tmpfs /run
            mkdir -m 0700 /run/louiselm-phone-host
            chown "$1:$2" /run/louiselm-phone-host
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              env -i "HOME=$3" "PATH=$4" "TMPDIR=$5" LANG=C.UTF-8 cargo test --offline --locked \
              --test managed_registration_cli -- --ignored --exact \
              pair_and_serve_consume_registration_without_granting_authority
          ' sh "$(id -u)" "$(id -g)" "$HOME" "$PATH" "${RUNNER_TEMP:-/tmp}"

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test native phone admission ordering
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          python3 scripts/test-phone-gate-order.py

      - name: Test Neovim phone-control boundaries
        working-directory: .
        run: |
          set -eu
          cargo build --manifest-path capture-service/Cargo.toml --locked --bin louiselm-capture
          ./scripts/install-test-deps
          LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            ./scripts/test-lua tests/phone_control/real_verifier_spec.lua
          LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            ./scripts/test-lua tests/phone_control/action_journal_spec.lua
          LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            ./scripts/test-lua tests/phone_control/action_dispatch_spec.lua
          LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            ./scripts/test-lua tests/phone_control/action_controller_spec.lua
          LOUISELM_TEST_NVIM="$(command -v nvim)" \
            LOUISELM_TEST_CAPTURE="$PWD/capture-service/target/debug/louiselm-capture" \
            cargo test --manifest-path capture-service/Cargo.toml --locked --lib \
              phone_control::http::tests::https_read_reaches_a_real_headless_session -- --exact --ignored

      - name: Test cross-service durable skill requests and Neovim observation
        run: |
          # This gate also builds skills-core and its embedded Sender guard.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang linux-libc-dev libbpf-dev libelf-dev
          python3 ../scripts/test-skill-requests

      - name: Test installed broker Attention provisioning across identities
        run: |
          python3 ../scripts/test-broker-attention-diagnostics.py
          cargo build --all-features --locked
          sudo env LOUISELM_REQUIRE_BROKER_ATTENTION=1 \
            "LOUISELM_TEST_CAPTURE=$PWD/target/debug/louiselm-capture" \
            timeout 120 unshare --mount --propagation private -- \
            python3 ../scripts/test-broker-attention.py

      - name: Test hardened capture system service across identities
        run: |
          sudo env LOUISELM_REQUIRE_CAPTURE_SYSTEMD=1 \
            "LOUISELM_TEST_CAPTURE=$PWD/target/debug/louiselm-capture" \
            timeout 120 python3 ../scripts/test-capture-systemd.py

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  skills-core:
    name: cargo (skills-core)
    runs-on: ubuntu-latest
    env:
      # The bootstrap executes as UID 60000, which cannot traverse the runner's
      # private home. Keep all Cargo artifacts outside the checkout ancestry.
      CARGO_TARGET_DIR: /var/tmp/louiselm-skills-target
      # louiselm-cjpep: measured fixtures hash entire executables repeatedly.
      # Keep backtrace locations without full type/variable debug metadata.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: skills-core
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux sandbox test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap strace clang linux-libc-dev libbpf-dev libelf-dev
          # Noble can deny capabilities inside an unprivileged user namespace;
          # this ephemeral runner exists specifically to exercise that path.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi

      - name: Install Rust
        run: |
          set -eu
          rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-skills-line-tables-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('skills-core/Cargo.lock') }}

      - name: Record runner resources
        run: |
          uname -r
          lscpu --json | jq '.lscpu | map(select(.field == "Model name:" or .field == "CPU(s):" or .field == "Architecture:"))'
          free -m

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        # Inject runner authority and synthetic signing config on clean CI too.
        # The launcher must isolate both without changing production behavior.
        run: bash ../scripts/test-skills-core-git-isolation 142</dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Recovery browser deadline regressions
        run: node --test --test-timeout=5000 tests/recovery_browser.test.cjs

      - name: Sender guard build and embedded artifact
        run: |
          python3 ../scripts/test-sender-guard-build.py
          python3 ../scripts/test-sender-guard.py "$CARGO_TARGET_DIR/debug/louiselm-launch"

      - name: Linked Admission across operator and read-only broker identities
        run: |
          python3 ../scripts/test-broker-admission-diagnostics.py
          broker_test=$(cargo test --locked --test broker --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "broker" and .executable != null) | .executable')
          sudo env LOUISELM_REQUIRE_BROKER_ADMISSION=1 \
            "LOUISELM_TEST_SKILLS=$CARGO_TARGET_DIR/debug/louiselm-skills" \
            "LOUISELM_TEST_ADMISSION_BROKER=$broker_test" \
            timeout 120 unshare --mount --propagation private -- \
            python3 ../scripts/test-broker-admission.py

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Required hostile launcher conformance
        run: ../scripts/launcher-conformance --disposable-guest

      - name: Test root-owned Session cgroup containment
        run: |
          set -eu
          test_identity=60000
          operator_uid="$(id -u)"
          operator_gid="$(id -g)"
          if getent passwd "$test_identity" >/dev/null || getent group "$test_identity" >/dev/null; then
            echo "test uid/gid $test_identity is already allocated" >&2
            exit 1
          fi
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          bootstrap="$(
            cargo build --bin louiselm-launch --all-features --locked --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm-launch" and (.profile.test | not)) | .executable // empty' |
              tail -n 1
          )"
          test -n "$bootstrap"
          sudo env \
            "PATH=$PATH" \
            "LOUISELM_TEST_BOOTSTRAP=$bootstrap" \
            "LOUISELM_TEST_HOST_ID=$test_identity" \
            "LOUISELM_TEST_OPERATOR_UID=$operator_uid" \
            "LOUISELM_TEST_OPERATOR_GID=$operator_gid" \
            LOUISELM_TEST_PINNED_CGROUP_ESCAPE=1 \
            /bin/bash -c 'umask 077; exec "$1" sandbox::tests::pinned_root_cgroup_prevents_operator_migration_of_a_session_process --exact --nocapture' bash "$library_test"

      - name: Test production relay cleanup with an open controller
        run: |
          set -eu
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          cargo build --bin louiselm-launch --all-features --locked
          sudo env LOUISELM_REQUIRE_SYSTEM_RELAY=1 \
            /bin/bash -c 'umask 077; exec "$1" launch_supervisor::system::relay_tests --nocapture' bash "$library_test"

      - name: Test measured Agent and isolated tool grants
        run: |
          set -eu
          cargo build --bins --all-features --locked
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          sudo env LOUISELM_REQUIRE_TOOL_ISOLATION=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::tool_integration_tests::privileged_measured_agent_owns_isolated_tool_lifecycle --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_TOOL_GRANTS=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::lifecycle::tool_dispatch::tests::grant_tests::privileged_measured_helper_grant_execution_and_revocation --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::privileged_installed_broker_launch_and_effects --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 unshare --mount --propagation private -- /bin/bash -c 'umask 022; mkdir -p /run/louiselm-launch; mount -t tmpfs -o mode=0711 tmpfs /run/louiselm-launch; exec "$1" launch_supervisor::system::installed_tests::skill_masks::privileged_installed_skills_off_masks_all_native_roots --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::provider_credentials::privileged_installed_provider_credentials_stay_broker_side --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 077; exec "$1" launch_supervisor::system::installed_tests::receipt_history::privileged_installed_receipt_history_survives_rotation_and_upgrade --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::receipt_history::isolation::privileged_installed_history_failure_is_session_local --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 180 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::receipt_history::revocation --nocapture --test-threads=1' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 180 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::receipt_history::cleanup --nocapture --test-threads=1' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::socket_activation::privileged_manager_listener_authenticates_only_broker_senders_across_restart --exact --nocapture' bash "$library_test"
          # Bound live lifecycle, offline state maintenance and CLI refusals independently.
          TIMEFORMAT='Activated daemon scenario elapsed: %3R seconds'
          for scenario in \
            privileged_activated_daemon_serves_launches_and_restart \
            state::privileged_activated_daemon_upgrades_and_adopts_state \
            inspection::privileged_activated_daemon_refuses_foreign_inspection \
            inspection::lifecycle::privileged_activated_daemon_operator_lifecycle \
            inspection::privileged_certified_admission_retains_report_and_suspends_on_evidence_loss \
            inspection::privileged_initial_waiver_prepares_approves_then_launches; do
            test_name="launch_supervisor::system::installed_tests::daemon::$scenario"
            printf 'Activated daemon scenario: %s\n' "$scenario"
            time sudo env LOUISELM_REQUIRE_CONTROL_DAEMON=1 \
              timeout 240 unshare --mount --propagation private --net -- /bin/bash -c 'umask 022; exec "$1" "$2" --exact --nocapture' bash "$library_test" "$test_name"
          done
          sudo env LOUISELM_REQUIRE_BROKER_BEADS=1 \
            "LOUISELM_TEST_BEADS_INSTALLER=$PWD/../scripts/install-broker-beads.py" \
            timeout 240 unshare --mount --propagation private -- /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::beads::privileged_installed_tracker_routes_only_approved_mutations --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_SYSTEMD=1 \
            timeout 120 python3 ../scripts/test-broker-systemd.py
          # Each full fixture gets its own deadline; keep the shared test account serial.
          TIMEFORMAT='Cold resume scenario elapsed: %3R seconds'
          for scenario in finite uncapped failed_load unavailable_balance; do
            test_name="launch_supervisor::system::installed_tests::privileged_installed_cold_resume_$scenario"
            printf 'Cold resume scenario: %s\n' "$scenario"
            time sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
              timeout 240 /bin/bash -c 'umask 022; exec "$1" "$2" --exact --nocapture' bash "$library_test" "$test_name"
          done
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::failures::privileged_installed_launch_failures_never_acknowledge_success --exact --nocapture' bash "$library_test"
          # Debian 13 exercises the full installed certifier. Other runner
          # profiles must explicitly refuse it, never issue a guest-derived pass.
          sudo env LOUISELM_REQUIRE_CERTIFICATION=1 \
            timeout 200 unshare --net -- /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::certification::privileged_installed_certification_owns_probes_and_retains_exact_evidence --exact --nocapture' bash "$library_test"

      - name: Test privileged launch supervisor composition
        run: |
          set -eu
          test_identity=60000
          operator_uid="$(id -u)"
          if getent passwd "$test_identity" >/dev/null || getent group "$test_identity" >/dev/null; then
            echo "test uid/gid $test_identity is already allocated" >&2
            exit 1
          fi
          supervisor_test="$(
            cargo test --test launch_supervisor --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "launch_supervisor" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$supervisor_test"
          sudo env \
            "LOUISELM_TEST_HOST_ID=$test_identity" \
            "LOUISELM_TEST_OPERATOR_UID=$operator_uid" \
            LOUISELM_REQUIRE_INITIAL_HOST_IDENTITY=1 \
            /bin/bash -c 'umask 077; exec "$1" privileged_supervisor_launches_agent_under_the_assigned_outer_identity --exact --nocapture' bash "$supervisor_test"

      - name: Test installed runtime preflight and measured Bubblewrap rejection
        run: |
          set -eu
          cargo build --bins --all-features --locked
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          for case in \
            installed_preflight_rejects_runtime_inside_tool_system_mount \
            production_prepare_rejects_bubblewrap_changed_after_runtime_config_before_spawn; do
            sudo env \
              LOUISELM_TEST_ROOT_LAUNCHER=1 \
              LOUISELM_REQUIRE_INITIAL_HOST_IDENTITY=1 \
              /bin/bash -c 'umask 077; exec "$1" "launch_supervisor::system::installed_tests::failures::$2" --exact --nocapture' bash "$library_test" "$case"
          done

      - name: Test root-owned installed release boundary
        run: |
          set -eu
          release_test="$(
            cargo test --test release --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "release" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$release_test"
          sudo env LOUISELM_REQUIRE_ROOT_RELEASE=1 \
            /bin/bash -c 'umask 022; exec "$1" installed_release_ --nocapture' bash "$release_test"

      - name: Test root-owned launch registry boundary
        run: |
          set -eu
          registry_test="$(
            cargo test --test registry --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "registry" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$registry_test"
          sudo env LOUISELM_REQUIRE_ROOT_REGISTRY=1 \
            /bin/bash -c 'umask 077; exec "$1" --nocapture' bash "$registry_test"
