# GitHub Actions pipeline for the Neovim plugin's quality gates.
#
# Scope: this runs the gates docs/agent-testing.md declares authoritative --
# StyLua for formatting, lua-language-server for static analysis, and
# mini.test for tests on the Lua side, cargo fmt/clippy/test/doc for each
# Rust crate, and Gradle test/lint/assemble for Android. It deliberately does NOT
# build or publish blog/, which is pages.yml's job (runs only when
# blog/ changes). The two pipelines are disjoint on purpose: pages.yml
# owns publishing, this one owns correctness.
#
# Every gate below was verified to fail, not merely to pass, before
# being wired up here (louiselm-w726's lesson: a check whose failure
# path was never exercised is indistinguishable from no check):
#   stylua --check .                             0 clean / 1 misformatted
#   lua-language-server --check --checklevel=Warning  0 clean / 1 on warning
#   nvim --headless ... MiniTest.run()           0 clean / 1 on test failure
#   cargo fmt --check                            0 clean / 1 misformatted
#   cargo clippy (all targets/features, locked)  0 clean / 101 on a lint
#   cargo test (all features, locked)           0 clean / 101 on test failure
#   cargo doc (no deps, warnings denied)        0 clean / 101 on a doc warning
#   Gradle Kotlin compilation                   0 clean / 1 on a warning
#   Gradle test                                 0 clean / 1 on a regression
#   Gradle lint                                 0 clean / 1 on a lint error
#
# The Rust gates cover capture-service/ and skills-core/ as separate jobs;
# they are separate crates with separate lockfiles, not a workspace, so one
# job's result says nothing about the other. capture-service's 56 tests were
# previously enforced nowhere (louiselm-ci-missing-rust-gates-5o5h). Its cargo
# test failure path was exercised by reverting the loopback status warning that
# fixes louiselm-capture-receiver-reachability-rnjc, which is precisely the
# defect these tests exist to keep fixed. skills-core's was exercised the same
# way, by disabling the hardlink-ambiguity refusal in capture and the
# digest-conflict refusal in the store and watching each guard's test go red.
# Android runs JVM/Robolectric tests without a device or live credentials.
# Failure probes: displaced pending-count update, deprecated Kotlin call, and
# incomplete translation resources. Existing lint warnings: louiselm-16a6.
#
# Tool versions are pinned rather than floated so an upstream release
# cannot silently turn this pipeline red (or, worse, green).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "blog/**"
  pull_request:
    paths-ignore:
      - "blog/**"
  workflow_dispatch:

# Supersede in-flight runs for the same ref. On a private repo Actions
# minutes are metered, so a rapid push sequence should not pay for
# every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the locally verified StyLua exactly (stylua 2.5.2).
  STYLUA_VERSION: 2.5.2
  # Local development currently runs 3.18.2-dev, which is not a
  # downloadable release; 3.19.1 is the closest published stable.
  LUALS_VERSION: 3.19.1
  # Matches the locally verified toolchain (rustc/cargo 1.97.1). capture-service
  # is edition 2024, so an older toolchain cannot build it at all.
  RUST_VERSION: 1.97.1

jobs:
  plugin-release-contract:
    name: Plugin release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version, commit policy and publication refusals
        run: |
          ./scripts/generate-plugin-version --check
          python3 scripts/check-release-commits.py
          python3 scripts/test-plugin-release.py
      - name: Test the exact release tool against disposable API history
        run: |
          set -eu
          release_tool_dir="$(mktemp -d)"
          git clone --quiet https://github.com/googleapis/release-please-action.git "$release_tool_dir"
          git -C "$release_tool_dir" checkout --quiet 5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
          npm ci --prefix "$release_tool_dir" --omit=dev --ignore-scripts --no-audit --no-fund
          NODE_PATH="$release_tool_dir/node_modules" node --test scripts/test-release-please.cjs

  agent-instructions:
    name: Agent instruction budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-agent-instructions

  launcher-vm-contract:
    name: Launcher VM safety contract (no VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/launcher-vm && ./scripts/test-launcher-vm.sh

  coordination-snapshot:
    name: Agent liveness snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/agent-liveness-snapshot && ./scripts/test-agent-liveness-snapshot.sh

  acp-local-backup:
    name: ACP backup, copy and retention (synthetic data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned runtime and run isolated backup tests
        run: |
          set -eu
          backup_test_tools="$(mktemp -d)"
          curl --fail --location --retry 2 --max-time 120 \
            --output "$backup_test_tools/restic.bz2" \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          printf '%s  %s\n' \
            f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c \
            "$backup_test_tools/restic.bz2" | sha256sum --check
          bzip2 --decompress "$backup_test_tools/restic.bz2"
          chmod 0755 "$backup_test_tools/restic"
          "$backup_test_tools/restic" version
          PATH="$backup_test_tools:$PATH" python3 scripts/test-acp-log-backup.py
          XDG_RUNTIME_DIR="$backup_test_tools" systemd-analyze --user verify \
            contrib/systemd/louiselm-acp-backup.service contrib/systemd/louiselm-acp-backup.timer \
            contrib/systemd/louiselm-acp-cloud-copy.service contrib/systemd/louiselm-acp-cloud-copy.timer \
            contrib/systemd/louiselm-acp-backup-failure.service

  android:
    name: Android tests, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Use the runner's installed JDK/SDK, not another setup dependency.
      - name: Test, lint, and assemble
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_25_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
          ./gradlew --no-daemon test lint lintQa assembleDebug assembleQa
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id \
            app/build/outputs/apk/qa/app-qa.apk)" = "dev.louiselm.capture.qa"

  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: --check .

  typecheck:
    name: lua-language-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache lua-language-server
        id: cache-luals
        uses: actions/cache@v4
        with:
          path: ~/.local/lua-language-server
          key: luals-${{ runner.os }}-${{ env.LUALS_VERSION }}

      - name: Install lua-language-server
        if: steps.cache-luals.outputs.cache-hit != 'true'
        run: |
          set -eu
          dest="$HOME/.local/lua-language-server"
          mkdir -p "$dest"
          curl -fsSL \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$dest"

      - name: Add lua-language-server to PATH
        run: echo "$HOME/.local/lua-language-server/bin" >> "$GITHUB_PATH"

      # --checklevel=Warning promotes warnings to failures, matching the
      # documented local gate. Verified to exit 1 on a single
      # undefined-global rather than reporting diagnostics and exiting 0.
      - name: Check
        run: lua-language-server --check . --checklevel=Warning

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Shares this job because it is the only one with lua-language-server
      # on PATH; scripts/generate-api-appendix shells out to `--doc`.
      - name: Verify generated API appendix
        run: ./scripts/generate-api-appendix --check

  test:
    name: mini.test (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    # docs/agent-lua.md targets the latest stable Neovim, so stable is
    # the contract and must block. Nightly runs for early warning of an
    # upstream break but is advisory: it must not fail the pipeline for
    # a change that honours the stated contract.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # scripts/install-test-deps pins mini.nvim to an exact revision and
      # verifies it after checkout, so the cache key can be that revision:
      # it stays warm until the pin is deliberately bumped.
      - name: Resolve pinned mini.nvim revision
        id: mini
        run: |
          set -eu
          rev=$(sed -n 's/^mini_revision="\(.*\)"$/\1/p' scripts/install-test-deps)
          test -n "$rev"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache mini.nvim
        uses: actions/cache@v4
        with:
          path: .deps
          key: mini-nvim-${{ steps.mini.outputs.revision }}

      - name: Install test dependencies
        run: ./scripts/install-test-deps

      # lua/louiselm/skills/discovery.lua requires lyaml to parse SKILL.md
      # frontmatter. It degrades gracefully when absent, so a machine without
      # it does not crash -- it silently fails 36 assertions across four spec
      # files that expect real parsed skill data (louiselm-zpsj).
      #
      # scripts/install-test-deps provisions only mini.nvim, so this is
      # installed here rather than by the documented setup path. That split is
      # deliberate but temporary: teaching the script to do it would make a
      # LuaRocks/LibYAML toolchain a prerequisite for running the tests, which
      # sits awkwardly against docs/agent-lua.md ("Lua runtime dependencies
      # are forbidden", "mini.test is the sole test dependency"). See
      # louiselm-zpsj before collapsing the two.
      #
      # Exporting LUA_PATH/LUA_CPATH is the mechanism the project already
      # documents for this: discovery.lua's own error text tells users to eval
      # `luarocks path` in the shell that launches Neovim.
      - name: Install lyaml and SQLite
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lua5.1 liblua5.1-0-dev luarocks libyaml-dev sqlite3
          sudo luarocks --lua-version 5.1 install lyaml
          eval "$(luarocks --lua-version 5.1 path --no-bin)"
          {
            echo "LUA_PATH=$LUA_PATH"
            echo "LUA_CPATH=$LUA_CPATH"
          } >> "$GITHUB_ENV"

      - name: Verify Neovim can load lyaml
        run: |
          nvim --headless --noplugin \
            -c "lua assert(pcall(require, 'lyaml'), 'nvim cannot require lyaml')" \
            -c "qa!"

      - name: Verify generated Vimdoc
        run: ./scripts/generate-vimdoc --check

      # Verified to fail, not merely to pass: 0 clean / 1 when the committed
      # lua/louiselm/types.lua diverges from the config schema.
      - name: Verify generated config types
        run: ./scripts/generate-luacats --check

      - name: Run tests
        run: |
          nvim --headless --noplugin -u ./tests/minimal_init.lua \
            -c "lua MiniTest.run()" -c "qa!"

  capture-service:
    name: cargo (capture-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture-service
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          set -eu
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component rustfmt,clippy
          rustup default "${RUST_VERSION}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capture-service/target
          key: cargo-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('capture-service/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Test installed broker Attention across identities
        run: |
          cargo build --all-features --locked
          sudo env LOUISELM_REQUIRE_BROKER_ATTENTION=1 \
            "LOUISELM_TEST_CAPTURE=$PWD/target/debug/louiselm-capture" \
            timeout 120 unshare --mount --propagation private -- \
            python3 ../scripts/test-broker-attention.py

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  skills-core:
    name: cargo (skills-core)
    runs-on: ubuntu-latest
    env:
      # The bootstrap executes as UID 60000, which cannot traverse the runner's
      # private home. Keep all Cargo artifacts outside the checkout ancestry.
      CARGO_TARGET_DIR: /var/tmp/louiselm-skills-target
      # louiselm-cjpep: measured fixtures hash entire executables repeatedly.
      # Keep backtrace locations without full type/variable debug metadata.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: skills-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux sandbox test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap strace
          # Noble can deny capabilities inside an unprivileged user namespace;
          # this ephemeral runner exists specifically to exercise that path.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi

      - name: Install Rust
        run: |
          set -eu
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component rustfmt,clippy
          rustup default "${RUST_VERSION}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-skills-line-tables-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('skills-core/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        # Inject runner authority and synthetic signing config on clean CI too.
        # The launcher must isolate both without changing production behavior.
        run: bash ../scripts/test-skills-core-git-isolation 142</dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recovery browser deadline regressions
        run: node --test --test-timeout=5000 tests/recovery_browser.test.cjs

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      - name: Required hostile launcher conformance
        run: ../scripts/launcher-conformance --disposable-guest

      - name: Test root-owned Session cgroup containment
        run: |
          set -eu
          test_identity=60000
          operator_uid="$(id -u)"
          operator_gid="$(id -g)"
          if getent passwd "$test_identity" >/dev/null || getent group "$test_identity" >/dev/null; then
            echo "test uid/gid $test_identity is already allocated" >&2
            exit 1
          fi
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          bootstrap="$(
            cargo build --bin louiselm-launch --all-features --locked --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm-launch" and (.profile.test | not)) | .executable // empty' |
              tail -n 1
          )"
          test -n "$bootstrap"
          sudo env \
            "PATH=$PATH" \
            "LOUISELM_TEST_BOOTSTRAP=$bootstrap" \
            "LOUISELM_TEST_HOST_ID=$test_identity" \
            "LOUISELM_TEST_OPERATOR_UID=$operator_uid" \
            "LOUISELM_TEST_OPERATOR_GID=$operator_gid" \
            LOUISELM_TEST_PINNED_CGROUP_ESCAPE=1 \
            /bin/bash -c 'umask 077; exec "$1" sandbox::tests::pinned_root_cgroup_prevents_operator_migration_of_a_session_process --exact --nocapture' bash "$library_test"

      - name: Test production relay cleanup with an open controller
        run: |
          set -eu
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          cargo build --bin louiselm-launch --all-features --locked
          sudo env LOUISELM_REQUIRE_SYSTEM_RELAY=1 \
            /bin/bash -c 'umask 077; exec "$1" launch_supervisor::system::relay_tests --nocapture' bash "$library_test"

      - name: Test measured Agent and isolated tool grants
        run: |
          set -eu
          cargo build --bins --all-features --locked
          library_test="$(
            cargo test --lib --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "louiselm_skills" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$library_test"
          sudo env LOUISELM_REQUIRE_TOOL_ISOLATION=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::tool_integration_tests::privileged_measured_agent_owns_isolated_tool_lifecycle --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_TOOL_GRANTS=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::lifecycle::tool_dispatch::tests::grant_tests::privileged_measured_helper_grant_execution_and_revocation --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::privileged_installed_broker_launch_and_effects --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 077; exec "$1" launch_supervisor::system::installed_tests::receipt_history::privileged_installed_receipt_history_survives_rotation_and_upgrade --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 120 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::socket_activation::privileged_manager_listener_authenticates_only_broker_senders_across_restart --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_CONTROL_DAEMON=1 \
            timeout 240 unshare --mount --propagation private -- /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::daemon::privileged_activated_daemon_serves_launches_and_restart --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_SYSTEMD=1 \
            timeout 120 python3 ../scripts/test-broker-systemd.py
          # Each full fixture gets its own deadline; keep the shared test account serial.
          TIMEFORMAT='Cold resume scenario elapsed: %3R seconds'
          for scenario in finite uncapped failed_load unavailable_balance; do
            test_name="launch_supervisor::system::installed_tests::privileged_installed_cold_resume_$scenario"
            printf 'Cold resume scenario: %s\n' "$scenario"
            time sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
              timeout 240 /bin/bash -c 'umask 022; exec "$1" "$2" --exact --nocapture' bash "$library_test" "$test_name"
          done
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::failures::privileged_installed_launch_failures_never_acknowledge_success --exact --nocapture' bash "$library_test"
          sudo env LOUISELM_REQUIRE_BROKER_LAUNCH=1 \
            timeout 180 /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::verification::privileged_installed_exact_job_verification --exact --nocapture' bash "$library_test"
          # Debian 13 exercises the full installed certifier. Other runner
          # profiles must explicitly refuse it, never issue a guest-derived pass.
          sudo env LOUISELM_REQUIRE_CERTIFICATION=1 \
            timeout 200 unshare --net -- /bin/bash -c 'umask 022; exec "$1" launch_supervisor::system::installed_tests::certification::privileged_installed_certification_owns_probes_and_retains_exact_evidence --exact --nocapture' bash "$library_test"

      - name: Test privileged launch supervisor composition
        run: |
          set -eu
          test_identity=60000
          operator_uid="$(id -u)"
          if getent passwd "$test_identity" >/dev/null || getent group "$test_identity" >/dev/null; then
            echo "test uid/gid $test_identity is already allocated" >&2
            exit 1
          fi
          supervisor_test="$(
            cargo test --test launch_supervisor --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "launch_supervisor" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$supervisor_test"
          sudo env \
            "LOUISELM_TEST_HOST_ID=$test_identity" \
            "LOUISELM_TEST_OPERATOR_UID=$operator_uid" \
            LOUISELM_REQUIRE_INITIAL_HOST_IDENTITY=1 \
            /bin/bash -c 'umask 077; exec "$1" privileged_supervisor_launches_agent_under_the_assigned_outer_identity --exact --nocapture' bash "$supervisor_test"

      - name: Test measured Bubblewrap rejection in the production launch path
        run: |
          set -eu
          launcher_install_test="$(
            cargo test --test launcher_install --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "launcher_install" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$launcher_install_test"
          sudo env \
            LOUISELM_TEST_ROOT_LAUNCHER=1 \
            LOUISELM_REQUIRE_INITIAL_HOST_IDENTITY=1 \
            /bin/bash -c 'umask 077; exec "$1" production_prepare_rejects_bubblewrap_changed_after_runtime_config_before_spawn --exact --nocapture' bash "$launcher_install_test"

      - name: Test root-owned installed release boundary
        run: |
          set -eu
          release_test="$(
            cargo test --test release --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "release" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$release_test"
          sudo env LOUISELM_REQUIRE_ROOT_RELEASE=1 \
            /bin/bash -c 'umask 022; exec "$1" installed_release_ --nocapture' bash "$release_test"

      - name: Test root-owned launch registry boundary
        run: |
          set -eu
          registry_test="$(
            cargo test --test registry --all-features --locked --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "registry" and .profile.test) | .executable // empty' |
              tail -n 1
          )"
          test -n "$registry_test"
          sudo env LOUISELM_REQUIRE_ROOT_REGISTRY=1 \
            /bin/bash -c 'umask 077; exec "$1" --nocapture' bash "$registry_test"
