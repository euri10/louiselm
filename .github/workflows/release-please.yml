name: Component releases

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run to retry (never publishes an unchecked SHA)
        required: true
        type: string

concurrency:
  group: plugin-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Activation is a maintainer operation after reviewing docs/releases.md.
    if: >-
      vars.PLUGIN_RELEASES_ENABLED == 'true' &&
      github.repository == 'euri10/louiselm' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      # workflow_run is privileged: run reviewed main code, never PR code or
      # artifacts from the triggering workflow. Source identity is fetched by SHA.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release App token for this repository
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create a read-only token for the immutability settings check
        id: immutability-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Check commit classification before making proposals
        run: python3 scripts/check-release-commits.py

      - name: Install the capture release toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-unknown-linux-gnu

      - name: Recover an already prepared draft before retrying Release Please
        env:
          GH_TOKEN: ${{ github.token }}
          GH_IMMUTABILITY_TOKEN: ${{ steps.immutability-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: |
          python3 scripts/publish-plugin-release.py --repository "$REPOSITORY" --run-id "$CI_RUN_ID"
          python3 scripts/publish-plugin-release.py --repository "$REPOSITORY" --run-id "$CI_RUN_ID" --component capture

      - name: Prepare unpublished release drafts
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          target-branch: main
          skip-github-pull-request: true

      - name: Publish only the checked approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_IMMUTABILITY_TOKEN: ${{ steps.immutability-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: |
          python3 scripts/publish-plugin-release.py --repository "$REPOSITORY" --run-id "$CI_RUN_ID"
          python3 scripts/publish-plugin-release.py --repository "$REPOSITORY" --run-id "$CI_RUN_ID" --component capture

      - name: Wait for outstanding component drafts before proposing another version
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ready=$(gh api --paginate --slurp "repos/$REPOSITORY/releases?per_page=100" |
            jq '[.[][] | select(.draft and (.tag_name | test("^(plugin|capture)-v")))] | length == 0')
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Propose the next component releases
        if: steps.pending.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          target-branch: main
          skip-github-release: true
